<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storyteller Game — Minda Inklusif AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --glass-bg: rgba(15, 23, 42, 0.75);
      --text-main: #f8fafc;
      --accent-sky: #38bdf8;
      --primary-font: 'Nunito', 'Segoe UI', sans-serif;
      --heading-font: 'Fredoka', 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--primary-font);
    }

    body {
      min-height: 100vh;
      background: linear-gradient(rgba(15, 23, 42, 0.72), rgba(15, 23, 42, 0.78)),
                  url('assets/image/bg1.jpg') center/cover no-repeat fixed;
      color: var(--text-main);
      padding: 24px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      width: 100%;
      max-width: 920px;
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
      border: 2px solid rgba(56, 189, 248, 0.35);
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.2);
      padding: 32px;
      position: relative;
    }

    .section-title {
      font-family: var(--heading-font);
      font-size: 2.3rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #38bdf8 45%, #0284c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 0px #0369a1);
    }

    .interactive-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
      outline: none;
    }

    .interactive-btn:hover {
      transform: translateY(-3px) scale(1.03);
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.8);
    }

    .interactive-btn.primary-btn {
      background: linear-gradient(135deg, #0284c7, #0d9488);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* SEQUENCE SLOTS DESIGN */
    .sequence-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 24px 0;
    }

    @media (max-width: 700px) {
      .sequence-board { grid-template-columns: 1fr; }
    }

    .slot {
      min-height: 190px;
      background: rgba(15, 23, 42, 0.6);
      border: 2px dashed rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      position: relative;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
    }

    .slot.drag-over {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      transform: scale(1.02);
    }

    .slot-num-badge {
      position: absolute;
      top: 10px;
      left: 12px;
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #38bdf8;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .slot-placeholder-text {
      opacity: 0.4;
      font-size: 0.9rem;
      font-weight: 700;
      margin-top: 10px;
    }

    /* CARDS POOL & 3D CARDS */
    .cards-pool {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
      min-height: 160px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
    }

    .story-card {
      width: 150px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.05));
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 18px;
      padding: 16px 12px;
      text-align: center;
      cursor: grab;
      user-select: none;
      transition: all 0.25s ease;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
    }

    .story-card:hover {
      transform: translateY(-6px) scale(1.05);
      border-color: #38bdf8;
    }

    .story-card.selected {
      border: 2px solid #38bdf8;
      box-shadow: 0 0 20px #38bdf8;
    }

    .story-card-emoji {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    .story-card-text {
      font-size: 0.9rem;
      font-weight: 800;
      color: #ffffff;
    }

    .feedback-box {
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 14px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 800;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feedback-success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #4ade80;
    }

    .feedback-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <button class="interactive-btn" style="position: absolute; top: 20px; right: 20px;" onclick="window.location.href='index.html'">⬅ Back to Home</button>
    
    <h2 class="section-title">📖 Storyteller: Sequence Game</h2>
    <p style="font-size: 1rem; opacity: 0.9; margin-bottom: 10px; font-weight: 700; color: #38bdf8;">
      Click or drag a picture card below into the numbered boxes to put the story in order!
    </p>

    <!-- Target Slots -->
    <div class="sequence-board">
      <div class="slot" id="slot1" onclick="placeInSlot(1)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 1)">
        <span class="slot-num-badge">Step 1</span>
        <span class="slot-placeholder-text">Drop Card Here</span>
      </div>
      <div class="slot" id="slot2" onclick="placeInSlot(2)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 2)">
        <span class="slot-num-badge">Step 2</span>
        <span class="slot-placeholder-text">Drop Card Here</span>
      </div>
      <div class="slot" id="slot3" onclick="placeInSlot(3)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 3)">
        <span class="slot-num-badge">Step 3</span>
        <span class="slot-placeholder-text">Drop Card Here</span>
      </div>
    </div>

    <!-- Draggable/Clickable Cards -->
    <div class="cards-pool" id="cardsPool" ondragover="handleDragOver(event)" ondrop="handleDropToPool(event)"></div>

    <div class="feedback-box" id="gameFeedback"></div>

    <div style="display: flex; justify-content: center; gap: 16px; margin-top: 20px;">
      <button class="interactive-btn primary-btn" style="font-size: 1.05rem; padding: 14px 28px;" onclick="checkStorySequence()">✨ Check Answer</button>
      <button class="interactive-btn" style="font-size: 1.05rem; padding: 14px 28px;" onclick="resetStoryGame()">🔄 Reset Game</button>
    </div>
  </div>

  <script>
    const storyData = [
      { id: 'step2', order: 2, emoji: '🌱', text: 'Water the Seed' },
      { id: 'step1', order: 1, emoji: '🪴', text: 'Plant the Seed' },
      { id: 'step3', order: 3, emoji: '🌻', text: 'Flower Grows' }
    ];

    let selectedCard = null;
    let slotContents = { 1: null, 2: null, 3: null };

    window.onload = resetStoryGame;

    function resetStoryGame() {
      selectedCard = null;
      slotContents = { 1: null, 2: null, 3: null };
      
      const feedback = document.getElementById('gameFeedback');
      feedback.innerText = '';
      feedback.className = 'feedback-box';
      
      const pool = document.getElementById('cardsPool');
      pool.innerHTML = '';
      
      const shuffled = [...storyData].sort(() => Math.random() - 0.5);
      
      shuffled.forEach(item => {
        const card = createStoryCard(item);
        pool.appendChild(card);
      });

      for (let i = 1; i <= 3; i++) {
        clearSlotUI(i);
      }
    }

    function createStoryCard(item) {
      const card = document.createElement('div');
      card.className = 'story-card';
      card.id = item.id;
      card.setAttribute('draggable', 'true');
      card.setAttribute('data-order', item.order);
      
      card.onclick = (e) => {
        e.stopPropagation();
        selectCard(card);
      };

      card.ondragstart = (e) => {
        e.dataTransfer.setData('text/plain', item.id);
        selectCard(card);
      };

      card.innerHTML = `<div class="story-card-emoji">${item.emoji}</div><div class="story-card-text">${item.text}</div>`;
      return card;
    }

    function selectCard(card) {
      document.querySelectorAll('.story-card').forEach(c => c.classList.remove('selected'));
      selectedCard = card;
      card.classList.add('selected');
    }

    function placeInSlot(slotNum) {
      if (!selectedCard) return;

      const slot = document.getElementById(`slot${slotNum}`);
      
      if (slotContents[slotNum]) {
        const oldCard = slot.querySelector('.story-card');
        if (oldCard) document.getElementById('cardsPool').appendChild(oldCard);
      }

      slot.innerHTML = `<span class="slot-num-badge">Step ${slotNum}</span>`;
      slot.appendChild(selectedCard);
      
      selectedCard.classList.remove('selected');
      slotContents[slotNum] = selectedCard.getAttribute('data-order');
      selectedCard = null;
    }

    function clearSlotUI(slotNum) {
      const slot = document.getElementById(`slot${slotNum}`);
      slot.innerHTML = `
        <span class="slot-num-badge">Step ${slotNum}</span>
        <span class="slot-placeholder-text">Drop Card Here</span>
      `;
      slotContents[slotNum] = null;
    }

    function handleDragOver(e) {
      e.preventDefault();
      if (e.currentTarget.classList.contains('slot')) {
        e.currentTarget.classList.add('drag-over');
      }
    }

    function handleDragLeave(e) {
      if (e.currentTarget.classList.contains('slot')) {
        e.currentTarget.classList.remove('drag-over');
      }
    }

    function handleDrop(e, slotNum) {
      e.preventDefault();
      const slot = document.getElementById(`slot${slotNum}`);
      slot.classList.remove('drag-over');
      
      const cardId = e.dataTransfer.getData('text/plain');
      const card = document.getElementById(cardId);
      if (card) {
        selectedCard = card;
        placeInSlot(slotNum);
      }
    }

    function handleDropToPool(e) {
      e.preventDefault();
      const cardId = e.dataTransfer.getData('text/plain');
      const card = document.getElementById(cardId);
      if (card) {
        for (let i = 1; i <= 3; i++) {
          if (slotContents[i] == card.getAttribute('data-order')) {
            clearSlotUI(i);
          }
        }
        document.getElementById('cardsPool').appendChild(card);
      }
    }

    function checkStorySequence() {
      const feedback = document.getElementById('gameFeedback');
      
      if (slotContents[1] == '1' && slotContents[2] == '2' && slotContents[3] == '3') {
        feedback.className = 'feedback-box feedback-success';
        feedback.innerText = '🎉 Fantastic job! You put the story steps in the right order!';
      } else {
        feedback.className = 'feedback-box feedback-error';
        feedback.innerText = '❌ Not quite right! Try rearranging the steps from first to last.';
      }
    }
  </script>
</body>
</html>
      document.getElementById('feedback').innerText = '';
    }
  </script>
</body>
</html>
