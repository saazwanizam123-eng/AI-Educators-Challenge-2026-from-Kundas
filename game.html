<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storyteller Game — Minda Inklusif AI</title>
  
  <!-- Clean, Accessible Sans-Serif Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       LIQUID GLASS DESIGN SYSTEM & ACCESSIBILITY STYLES
       ========================================================================== */
    :root {
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.25);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      --text-main: #f8fafc;
      --accent-teal: #0d9488;
      --accent-glow: rgba(13, 148, 136, 0.6);
      --primary-font: 'Nunito', 'Segoe UI', sans-serif;
      --heading-font: 'Fredoka', 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--primary-font);
    }

    /* BACKGROUND IMAGE: BG1 ONLY */
    body {
      min-height: 100vh;
      background: url('assets/image/bg1.jpg') center/cover no-repeat fixed;
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* High Contrast Mode Toggle Class */
    body.high-contrast {
      background: #000000 !important;
      color: #ffff00 !important;
    }

    body.high-contrast .glass-card,
    body.high-contrast .story-card,
    body.high-contrast .slot {
      background: #000000 !important;
      border: 2px solid #ffff00 !important;
      box-shadow: none !important;
      color: #ffff00 !important;
    }

    body.high-contrast .interactive-btn {
      background: #000000 !important;
      border: 2px solid #ffff00 !important;
      color: #ffff00 !important;
    }

    /* ==========================================================================
       VIBRANT 3D CLAY TEXTURE SECTION HEADINGS
       ========================================================================== */
    .section-title {
      font-family: var(--heading-font);
      font-size: 2.1rem;
      font-weight: 800;
      margin: 0 0 15px 0;
      display: inline-block;
      letter-spacing: 0.5px;
      
      background: linear-gradient(180deg, #ffffff 0%, #38bdf8 45%, #0284c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      
      filter: drop-shadow(0px 2px 0px #0369a1)
              drop-shadow(0px 4px 0px #075985)
              drop-shadow(0px 6px 1px rgba(0, 0, 0, 0.4));
      
      transition: transform 0.3s ease, filter 0.3s ease;
      cursor: pointer;
    }

    .section-title:hover {
      transform: scale(1.03) translateY(-2px);
      filter: drop-shadow(0 0 12px var(--accent-glow));
    }

    /* ==========================================================================
       INTERACTIVE BUTTONS (CLEAN TYPOGRAPHY)
       ========================================================================== */
    .interactive-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      outline: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .interactive-btn:hover {
      transform: translateY(-2px) scale(1.04);
      background: rgba(255, 255, 255, 0.28);
      box-shadow: 0 0 15px var(--accent-glow);
      border-color: #ffffff;
    }

    .interactive-btn:active {
      transform: scale(0.97);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(8px);
    }

    /* ==========================================================================
       STORYTELLER GAME BOARD
       ========================================================================== */
    .modal-content {
      width: 100%;
      max-width: 900px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: rgba(239, 68, 68, 0.3);
      border: 1px solid #ef4444;
      color: #fff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .sequence-board {
      display: flex;
      gap: 15px;
      margin: 20px 0;
      justify-content: center;
      flex-wrap: wrap;
    }

    .slot {
      width: 160px;
      height: 180px;
      background: rgba(0, 0, 0, 0.3);
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
    }

    .slot-num {
      position: absolute;
      top: 6px;
      left: 10px;
      font-weight: 800;
      opacity: 0.5;
      font-size: 0.85rem;
    }

    .cards-pool {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 15px;
      min-height: 140px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 16px;
    }

    .story-card {
      width: 140px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .story-card:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .story-card.selected {
      border: 2px solid #38bdf8;
      box-shadow: 0 0 15px #38bdf8;
    }

    .story-card-emoji {
      font-size: 2.2rem;
      margin-bottom: 5px;
    }

    .story-card-text {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .feedback-box {
      margin-top: 15px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 800;
      min-height: 30px;
    }
  </style>
</head>
<body>

  <div class="glass-card modal-content">
    <button class="interactive-btn" style="position: absolute; top: 15px; right: 20px;" onclick="window.location.href='index.html'">⬅ Back</button>
    <h2 class="section-title">📖 Storyteller: Sequence Game</h2>
    <p style="font-size: 0.95rem; opacity: 0.9;">Click a picture card below, then click a box to put the story steps in order!</p>

    <!-- Target Slots -->
    <div class="sequence-board">
      <div class="slot" id="slot1" onclick="placeInSlot(1)">
        <span class="slot-num">Step 1</span>
      </div>
      <div class="slot" id="slot2" onclick="placeInSlot(2)">
        <span class="slot-num">Step 2</span>
      </div>
      <div class="slot" id="slot3" onclick="placeInSlot(3)">
        <span class="slot-num">Step 3</span>
      </div>
    </div>

    <!-- Draggable/Clickable Cards -->
    <div class="cards-pool" id="cardsPool"></div>

    <div class="feedback-box" id="gameFeedback"></div>

    <div style="display: flex; justify-content: center; gap: 15px; margin-top: 15px;">
      <button class="interactive-btn" onclick="checkStorySequence()">✨ Check Answer</button>
      <button class="interactive-btn" onclick="resetStoryGame()">🔄 Reset Game</button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       STORYTELLER GAME LOGIC
       ========================================================================== */
    const storyData = [
      { id: 'step2', order: 2, emoji: '🌱', text: 'Water the Seed' },
      { id: 'step1', order: 1, emoji: '🪴', text: 'Plant the Seed' },
      { id: 'step3', order: 3, emoji: '🌻', text: 'Flower Grows' }
    ];

    let selectedCard = null;
    let slotContents = { 1: null, 2: null, 3: null };

    window.onload = resetStoryGame;

    function resetStoryGame() {
      selectedCard = null;
      slotContents = { 1: null, 2: null, 3: null };
      document.getElementById('gameFeedback').innerText = '';
      
      const pool = document.getElementById('cardsPool');
      pool.innerHTML = '';
      
      storyData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'story-card';
        card.id = item.id;
        card.setAttribute('data-order', item.order);
        card.onclick = () => selectCard(card);
        card.innerHTML = `<div class="story-card-emoji">${item.emoji}</div><div class="story-card-text">${item.text}</div>`;
        pool.appendChild(card);
      });

      for (let i = 1; i <= 3; i++) {
        const slot = document.getElementById(`slot${i}`);
        slot.innerHTML = `<span class="slot-num">Step ${i}</span>`;
      }
    }

    function selectCard(card) {
      document.querySelectorAll('.story-card').forEach(c => c.classList.remove('selected'));
      selectedCard = card;
      card.classList.add('selected');
    }

    function placeInSlot(slotNum) {
      if (!selectedCard) return;

      const slot = document.getElementById(`slot${slotNum}`);
      slot.innerHTML = `<span class="slot-num">Step ${slotNum}</span>`;
      slot.appendChild(selectedCard);
      
      selectedCard.classList.remove('selected');
      slotContents[slotNum] = selectedCard.getAttribute('data-order');
      selectedCard = null;
    }

    function checkStorySequence() {
      const feedback = document.getElementById('gameFeedback');
      if (slotContents[1] == '1' && slotContents[2] == '2' && slotContents[3] == '3') {
        feedback.style.color = '#4ade80';
        feedback.innerText = '🎉 Wonderful job! The story sequence is correct!';
      } else {
        feedback.style.color = '#f87171';
        feedback.innerText = '❌ Try again! Put the steps from first to last.';
      }
    }
  </script>
</body>
</html>
